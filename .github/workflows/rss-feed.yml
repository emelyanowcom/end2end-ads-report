name: Regenerate RSS feed and blog sitemap

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install deps
        working-directory: scripts/rss-feed
        run: npm install

      # Framer API периодически флейкает ("Some modules are missing",
      # "auth redirect") — транзиентные ошибки, лечатся повтором.
      - name: Generate feed.xml
        working-directory: scripts/rss-feed
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL }}
        run: |
          for attempt in 1 2 3; do
            npm run generate && exit 0
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          exit 1

      - name: Install sitemap-blog deps
        working-directory: scripts/sitemap-blog
        run: npm install

      - name: Generate sitemap-blog.xml
        working-directory: scripts/sitemap-blog
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL }}
        run: |
          for attempt in 1 2 3; do
            npm run generate && exit 0
            echo "Attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          exit 1

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages-deploy origin/gh-pages
          cp scripts/rss-feed/feed.xml /tmp/gh-pages-deploy/feed.xml
          cp scripts/sitemap-blog/sitemap-blog.xml /tmp/gh-pages-deploy/sitemap-blog.xml
          cd /tmp/gh-pages-deploy
          if git diff --quiet; then
            echo "No changes to feed.xml or sitemap-blog.xml"
          else
            git add feed.xml sitemap-blog.xml
            git commit -m "Auto-update RSS feed and blog sitemap"
            git push origin HEAD:gh-pages
          fi
